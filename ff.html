<!DOCTYPE html>
<html lang="fr">

<title>Menu Traiteur</title>

<style>

body{
font-family: Arial;
background:#000000;
margin:0;
}

/* TITRE */

.titre-menu{
text-align:center;
font-size:40px;
margin-top:40px;
color:#b48a5a;
}

/* BOUTONS */

.filtres{
text-align:center;
margin:40px 0;
}

.filtres button{
padding:12px 25px;
margin:10px;
border:none;
background:#b48a5a;
color:white;
border-radius:30px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.filtres button:hover{
background:#8c6a45;
}

/* GALERIE */

.galerie{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
width:90%;
margin:auto;
padding-bottom:60px;
}

.plat{
position:relative;
overflow:hidden;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.plat img{
width:100%;
height:220px;
object-fit:cover;
transition:0.4s;
}

.plat:hover img{
transform:scale(1.1);
}

/* NOM DU PLAT */

.nom{
position:absolute;
bottom:0;
background:rgba(0,0,0,0.6);
color:white;
width:100%;
text-align:center;
padding:10px;
font-size:18px;
}

</style>
</head>

<script>

function filtrer(categorie){

let plats = document.querySelectorAll(".plat");

plats.forEach(function(p){

if(categorie === "all"){
p.style.display="block";
}
else if(p.classList.contains(categorie)){
p.style.display="block";
}
else{
p.style.display="none";
}

});

}
